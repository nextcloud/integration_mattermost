name: Node Build

on:
  pull_request:
    paths:
      - src/**
      - .eslintrc.js
      - stylelint.config.js
      - webpack.js
  push:
    branches:
      - main
    paths:
      - src/**
      - .eslintrc.js
      - stylelint.config.js
      - webpack.js

env:
  APP_NAME: integration_mattermost

jobs:
  build:
    name: node-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: ${{ env.APP_NAME }}

      - name: Read package.json node and npm engines version
        uses: skjnldsv/read-package-engines-version-actions@06d6db44aa62f4609ba070f556ec24bc99fb85cb # v4
        id: versions
        with:
          path: ${{ env.APP_NAME }}
          fallbackNode: "^20"
          fallbackNpm: "^9"

      - name: Set up node ${{ steps.versions.outputs.nodeVersion }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v3
        with:
          node-version: ${{ steps.versions.outputs.nodeVersion }}

      - name: Set up npm ${{ steps.versions.outputs.npmVersion }}
        run: npm i -g npm@"${{ steps.versions.outputs.npmVersion }}"

      - name: Build ${{ env.APP_NAME }}
        run: |
          cd ${{ env.APP_NAME }}
          npm ci
          npm run build
